# =============================================================================
# 投资策略配置（strategy.yaml）
# -----------------------------------------------------------------------------
# 框架：核心-卫星（70% 宽基 + 20% 主题 + 10% 海外/防御）
#       + 智能定投（估值分位动态调额）+ 止盈不止损 + 分批/回撤/估值止盈
# =============================================================================

# --- 投资者画像 ---
investor:
  risk_level: moderate
  horizon_years: 3
  max_drawdown_tolerance: 0.15
  monthly_invest_ratio: 0.25   # 建议月结余的 25% 用于基金（主流 20%-30%）
  notes: "核心-卫星策略：宽基打底，主题卫星博超额，纳指日定投作海外分散"

# --- 仓位上限 ---
allocation:
  max_single_fund_ratio: 0.40   # 单基上限 40%（防止卫星过重）
  max_theme_ratio: 0.40         # 同主题合计上限 40%
  cash_buffer_ratio: 0.10       # 建议留 10% 现金
  relax_caps_when_value_below: 5000

# --- 核心-卫星资产配置（2026 主流框架）---
core_satellite:
  enabled: true
  core_target_ratio: 0.70         # 宽基核心 70%
  satellite_target_ratio: 0.20    # 行业卫星 20%
  hedge_target_ratio: 0.10        # 防御/海外 10%
  rebalance_threshold: 0.05       # 偏离 ±5% 触发再平衡提示
  rebalance_interval_days: 180    # 建议每半年检查一次
  core_fund_codes: ["002900"]     # 宽基核心（中证500信息技术）
  satellite_fund_codes: ["012737", "012734"]  # 创新药、人工智能
  hedge_fund_codes: ["270042"]    # 纳斯达克 QDII 定投
  broad_index_keywords:
    - 沪深300
    - 中证500
    - A500
    - 上证50
    - 红利
    - 500信息
    - 500信息技术

# --- 止盈止损与再平衡 ---
signals:
  rebalance_threshold: 0.05
  stop_loss_enabled: false        # 主流策略：止盈不止损；下跌优先定投不加割肉
  stop_loss_ratio: -0.25          # 若手动开启 stop_loss_enabled，极端浮亏线
  take_profit_ratio: 0.20
  take_profit_steps: [0.15, 0.20, 0.30]
  take_profit_sell_ratio: 0.33    # 每档卖 1/3；20% 时卖 50% 由 AI 综合判断

# --- 动态回撤止盈 ---
trailing_stop:
  enabled: true
  trigger_profit_pct: 0.20
  max_drawdown_pct: 0.10

# --- 估值止盈（已启用）---
valuation_take_profit:
  enabled: true
  pe_percentile_threshold: 0.80   # ≥80% 分批止盈
  pe_percentile_full_exit: 0.90   # ≥90% 卫星大幅止盈，利润转宽基
  index_code: "000300.SH"

# --- 智能定投（估值分位动态调额）---
smart_dca:
  enabled: true
  index_code: "000300.SH"
  base_daily_cny: 10              # 基础日定投（270042 纳指）
  low_percentile: 0.30            # ≤30% 加倍
  high_percentile: 0.70           # ≥70% 减半
  very_high_percentile: 0.90      # ≥90% 暂停
  low_multiplier: 2.0
  high_multiplier: 0.5
  very_high_multiplier: 0.0

# --- 交易行为约束 ---
trading:
  mode: semi_auto
  min_days_between_switch: 30
  max_daily_buy_amount: 500
  dca_only_funds:
    - "270042"

# --- 持仓计划 ---
portfolio_plan:
  strategy: core_satellite
  core_fund: "002900"             # 宽基核心（与 core_satellite 一致）
  core_funds: ["002900"]
  satellite_funds: ["012737", "012734"]
  hedge_fund: "270042"
  dca_fund: "270042"
  dca_daily_cny: 10
  dca_channel: "支付宝"

# --- 日报对比基准 ---
benchmark:
  index_code: "000300.SH"

# --- 相关新闻 ---
news:
  enabled: true
  summarize: true
  auto_keywords_from_holdings: true
  keywords:
    - 人工智能
    - 半导体
    - 创新药
    - 消费
    - 电力
    - 算力
    - 纳斯达克
    - 美联储
    - 未来国家政策热点
    - 主力资金预测流入
  max_per_keyword: 3
  max_total: 12
  max_age_hours: 72
  request_interval_sec: 1.0

# --- 主力资金流向 ---
market_flow:
  enabled: true
  top_sectors: 5
  include_concepts: true
  request_interval_sec: 1.0
  theme_keywords:
    人工智能: [人工智能, 半导体, 芯片, 算力, 机器人]
    消费: [消费, 白酒, 食品, 饮料]
    创新药: [创新药, 生物医药, 医药, 生物科技]
    电力: [电力, 电网, 新能源, 风电, 光伏]
    算力: [算力, 云计算, 数据中心, 人工智能, 机器人]
    纳斯达克: [纳斯达克, 美国, 科技, 互联网, 科技股]
    美联储: [美联储, 美国, 货币政策, 利率, 经济]
    未来国家政策热点: [未来国家政策热点, 国家政策, 国家发展, 国家战略, 国家规划]
    主力资金预测流入: [主力资金预测流入, 主力资金, 资金流入, 资金流出, 资金流向]

# --- AI 短期方向研判 ---
market_outlook:
  enabled: true

# --- 趋势观察 ---
trend_observation:
  enabled: true
  lookback_days: 90
  big_move_pct: 12
  small_correction_pct: 6
  prefer_hold_on_uptrend: true
  avoid_chase_on_downtrend: true
  philosophy: |
    核心-卫星 + 止盈不止损：宽基核心长期持有，卫星浮盈达标分批止盈并转回核心；
    阶段大涨小回以持有为主，大跌小弹不急于追；下跌时优先智能定投摊薄，不因波动 panic 割肉。

# --- 推荐看板 ---
recommendation_board:
  enabled: true
  max_fund_picks: 5
  max_stock_picks: 8
  use_weekly_recommend_days: 14
  history_days: 30

# --- 全市场选基 ---
recommendation:
  enabled: true
  budget_cny: 5000
  fund_types:
    - 混合型
    - 指数型
    - 股票型
    - QDII
  max_candidates: 60
  min_return_1y: null
  exclude_name_keywords:
    - 债券
    - 货币
    - 理财
  prefer_themes:
    - 沪深300
    - 中证500
    - A500
    - 红利
    - 人工智能
    - 科技
    - 创新药
    - 纳斯达克
    - 消费
    - 电力
    - 算力
  max_recommendations: 5

  allocation_plan:
    require_core_add: true
    core_fund: "002900"           # 宽基核心优先加仓
    min_core_add_cny: 1500        # 主仓宽基至少 1500 元
    broad_index_min_ratio: 0.70     # 宽基合计 ≥70%
    satellite_max_ratio: 0.20       # 主题卫星 ≤20%
    broad_index_keywords:
      - 沪深300
      - 中证500
      - A500
      - 上证50
      - 红利
      - 500信息
      - 500信息技术
    reserve_cash_ratio: 0.05

  batch_plan:
    enabled: true
    tranches: 3
    days_between: 7
    dca_daily_cny: 10
    dca_fund: "270042"
    note: "270042 纳指智能定投（基础10元/天，按估值分位动态调整），不计入本次5000"
